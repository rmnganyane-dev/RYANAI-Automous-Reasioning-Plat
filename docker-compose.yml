version: '3.8'

services:
  ryanai-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ryanai-runtime
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ryanai
    depends_on:
      - postgres
    networks:
      - ryanai-net
    restart: always

  ryanai-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ryanai-web-app
    ports:
      - "9090:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
    depends_on:
      - ryanai-api
    networks:
      - ryanai-net
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: ryanai-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ryanai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ryanai-net
    restart: always

volumes:
  pgdata:

networks:
  ryanai-net:
    driver: bridge