services:
  ryanai-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ryanai-web:local
    container_name: ryanai-web-app
    restart: unless-stopped
    environment:
      - PORT=80
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ryanai-network

networks:
  ryanai-network:
    driver: bridge