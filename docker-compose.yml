services:
  ryanai-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ryanai-web:local
    container_name: ryanai-web-app
    restart: unless-stopped
    ports:
      - "9090:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ryanai-network

networks:
  ryanai-network:
    driver: bridge