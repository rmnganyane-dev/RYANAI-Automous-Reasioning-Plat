version: '3.8'

services:
  ryanai-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ryanai-runtime
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@ryanai-db:5432/${DB_NAME:-ryanai}
      - REDIS_URL=redis://ryanai-redis:6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      ryanai-db:
        condition: service_healthy
      ryanai-redis:
        condition: service_started
    networks:
      - ryanai-net
    restart: unless-stopped

  ryanai-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ryanai-web-app
    ports:
      - "9090:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
    depends_on:
      - ryanai-api
    networks:
      - ryanai-net
    restart: unless-stopped

  ryanai-db:
    image: postgres:16
    container_name: ryanai-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ryanai}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ryanai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init_vector_memory.sql:/docker-entrypoint-initdb.d/init_vector_memory.sql
    networks:
      - ryanai-net
    restart: unless-stopped

  ryanai-redis:
    image: redis:7-alpine
    container_name: ryanai-redis
    ports:
      - "6379:6379"
    networks:
      - ryanai-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  ryanai-net:
    driver: bridge