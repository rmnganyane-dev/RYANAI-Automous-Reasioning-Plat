services:
  ryanai-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ryanai-runtime
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ryanai
      - REDIS_URL=redis://redis:6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ryanai-net
    restart: unless-stopped

  ryanai-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ryanai-web-app
    ports:
      - "9090:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
    depends_on:
      - ryanai-api
    networks:
      - ryanai-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ryanai-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ryanai
    ports:
      - "5432:5432"
    command: postgres -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ryanai"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/migrations:/docker-entrypoint-initdb.d
    networks:
      - ryanai-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ryanai-redis
    ports:
      - "6379:6379"
    networks:
      - ryanai-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  ryanai-net:
    driver: bridge