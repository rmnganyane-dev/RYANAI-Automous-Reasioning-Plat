version: '3.8'

services:
  # PostgreSQL Database with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ryanai-postgres
    environment:
      POSTGRES_USER: ryanai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ryanai_secure_password}
      POSTGRES_DB: ryanai_db
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=vector"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryanai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ryanai-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ryanai-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-ryanai_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ryanai-network
    restart: unless-stopped

  # RyanAI API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ryanai-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://ryanai:${DB_PASSWORD:-ryanai_secure_password}@postgres:5432/ryanai_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-ryanai_redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3001:3001"
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ryanai-network
    restart: unless-stopped

  # RyanAI Frontend (React + Nginx)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ryanai-web
    depends_on:
      - api
    environment:
      VITE_API_URL: http://api:3001
      VITE_WS_URL: ws://localhost:3001/ws
    ports:
      - "9090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ryanai-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ryanai-network:
    driver: bridge