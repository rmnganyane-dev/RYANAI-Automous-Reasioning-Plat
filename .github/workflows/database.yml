name: Project Ryan Database Schema & Migration CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '**/prisma/**'
      - '**/*.prisma'
      - 'database/**'
      - '.github/workflows/database.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '**/prisma/**'
      - '**/*.prisma'
      - 'database/**'
      - '.github/workflows/database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-database:
    name: Validate Schema & Run Migration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ryan_app_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schemas
        run: |
          echo "🔍 Searching and validating Prisma schema files..."
          find . -name "schema.prisma" -not -path "*/node_modules/*" | while read -r schema_file; do
            echo "Validating $schema_file..."
            pnpm exec prisma validate --schema="$schema_file"
          done
          echo "✅ All Prisma schemas successfully validated."

      - name: Generate Prisma Client & Test Migrations
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/ryan_app_migration_test?schema=public
        run: |
          echo "🚀 Generating Prisma Clients and running migration dry-run..."
          find . -name "schema.prisma" -not -path "*/node_modules/*" | while read -r schema_file; do
            dir=$(dirname "$schema_file")
            echo "Processing database schema in $dir..."
            (cd "$dir" && pnpm exec prisma generate --schema="schema.prisma")
            (cd "$dir" && pnpm exec prisma migrate deploy --schema="schema.prisma" || pnpm exec prisma db push --skip-generate --schema="schema.prisma")
          done
          echo "✅ Database migration dry-run completed successfully."
