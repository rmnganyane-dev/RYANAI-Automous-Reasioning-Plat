name: RyanAI Production CI/CD Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn chromadb langgraph pytest pydantic

    - name: Run Integration Test Suite
      run: |
        pytest tests/test_ryan_platform.py

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Fastify Gateway
      run: |
        cd services/fastify-gateway
        npm install
        npm run build --if-present

    - name: Run Telemetry & Diagnostic Check
      run: |
        python3 scripts/ryan_status.py
        python3 scripts/ryan_benchmark.py