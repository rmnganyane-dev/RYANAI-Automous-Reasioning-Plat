name: Project Ryan CI/CD

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

# Cancels previous in-progress runs on the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-monorepo:
    name: Build & Test TS Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # Updated to v4 for better pnpm 9 support
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm' # Enables automatic caching of pnpm store

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict Typecheck
        run: pnpm -r run typecheck

      - name: Compile TypeScript Packages
        run: pnpm -r run build

      - name: Run Unit & Integration Tests
        run: pnpm -r run test

  verify-cuda-engine:
    name: Verify C++ CUDA Native Compiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Essentials & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.3.0
        with:
          # You can pin this to your specific local CUDA version (e.g., '12.2.0')
          cuda: '12.x' 

      - name: Build C++ CUDA Target
        # Removed --dry-run so the nvcc compiler actually builds the object files
        run: |
          cd packages/cuda-engine
          make all

  docker-smoke-test:
    name: Compose Build Smoke Test
    runs-on: ubuntu-latest
    needs: [verify-monorepo, verify-cuda-engine] # Waits for both TS and C++ to pass

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Services
        # Tests that the Fastify gateway containerizes correctly
        run: docker compose -f docker-compose.dev.yml build gateway
        
      # Optional but recommended: Verify the container actually starts without crashing
      # - name: Verify Gateway Starts
      #   run: |
      #     docker compose -f docker-compose.dev.yml up -d gateway
      #     sleep 5
      #     docker compose -f docker-compose.dev.yml ps gateway | grep "Up"
      #     docker compose -f docker-compose.dev.yml down