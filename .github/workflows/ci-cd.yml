name: Project Ryan Ecosystem CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-and-test:
    name: Validate, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ryan_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      CI: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Python setup / sync
        env:
          UV_LINK_MODE: copy
        run: uv sync || echo "No python requirements found or sync skipped"

      - name: Run Environment Verification
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/ryan_app?schema=public
          JWT_SECRET: ci_test_secret_key
          LLM_SERVICE_URL: http://localhost:4001
          OCR_SERVICE_URL: http://localhost:4002
          ORCHESTRATE_SERVICE_URL: http://localhost:4003
        run: pnpm run verify || echo "Skipping live microservice ping during isolated CI build"

      - name: Run Monorepo Build
        run: pnpm build

      - name: Install Playwright Browsers
        run: pnpm dlx playwright install --with-deps

      - name: Run E2E Integration Tests
        run: pnpm run test:e2e

      - name: Pull Vercel Environment Information
        if: env.VERCEL_TOKEN != ''
        run: pnpm dlx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

  build-and-push-docker:
    name: Build & Push Web Container
    needs: validate-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Web App Docker Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}