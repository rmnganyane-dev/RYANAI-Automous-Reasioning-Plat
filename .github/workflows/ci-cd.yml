# File path: .github/workflows/ci-cd.yml

name: RyanAI Production CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  test-and-build:
    name: Build, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ryanai_user
          POSTGRES_PASSWORD: ryanai_password
          POSTGRES_DB: ryanai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ryanai_user -d ryanai_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install System Dependencies (eBPF & node-gyp)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 linux-headers-generic libbpf-dev

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Database & Prisma Client
        run: |
          pnpm prisma generate
          pnpm prisma db push
        env:
          DATABASE_URL: "postgresql://ryanai_user:ryanai_password@localhost:5432/ryanai_db?schema=public"

      - name: Type Check
        run: pnpm run typecheck

      - name: Build Frontend & Backend
        run: pnpm run build

      - name: Run E2E & Platform Tests
        run: pnpm run test:platform
        env:
          BASE_URL: "http://localhost:3000"
          SLACK_SIGNING_SECRET: "mock_secret_for_ci"
          DATABASE_URL: "postgresql://ryanai_user:ryanai_password@localhost:5432/ryanai_db?schema=public"

  docker-publish:
    name: Build & Push Docker Image
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Repository Name to Lowercase
        id: lowercase-repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Extract Metadata (Tags, Labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase-repo.outputs.repo }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production VPS
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/ryanai            
            # Log in to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest images and restart containers with zero downtime orchestration
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Prune old unused images
            docker image prune -f