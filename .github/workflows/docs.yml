name: Project Ryan Documentation & API Spec Validation

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'docs/**'
      - '**/swagger/**'
      - '**/*.openapi.json'
      - '**/*.openapi.yaml'
      - '**/*.openapi.yml'
      - '**/*.swagger.json'
      - '**/*.swagger.yaml'
      - '**/*.swagger.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'docs/**'
      - '**/swagger/**'
      - '**/*.openapi.json'
      - '**/*.openapi.yaml'
      - '**/*.openapi.yml'
      - '**/*.swagger.json'
      - '**/*.swagger.yaml'
      - '**/*.swagger.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Validate Docs & API Specs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI & Swagger Specs
        run: |
          echo "🔍 Scanning and validating OpenAPI/Swagger specifications..."
          
          # Validate JSON specs safely
          find . \( -name "*.openapi.json" -o -name "*.swagger.json" \) -not -path "*/node_modules/*" | while read -r spec; do
            echo "Validating JSON spec: $spec"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$spec"
          done

          # Validate YAML specs safely
          find . \( -name "*.openapi.yaml" -o -name "*.openapi.yml" -o -name "*.swagger.yaml" -o -name "*.swagger.yml" \) -not -path "*/node_modules/*" | while read -r spec; do
            echo "Validating YAML spec: $spec"
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$spec"
          done

          echo "✅ API specifications validation completed successfully."

      - name: Build Documentation Artifacts
        run: |
          if [ -d "docs" ]; then
            echo "📚 Building project documentation..."
            if grep -q '"docs:build"' package.json; then
              pnpm run docs:build
            else
              echo "ℹ️ No dedicated docs:build script found in root package.json."
            fi
          else
            echo "ℹ️ No docs directory found."
          fi
          echo "✅ Documentation pipeline verified."