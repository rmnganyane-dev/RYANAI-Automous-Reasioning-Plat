name: Monorepo Vercel Deployment & Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate Workspace & Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CI: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Check for Conflicting Lockfiles
        run: |
          if [ -f "package-lock.json" ] || [ -f "yarn.lock" ]; then
            echo "❌ Error: Found legacy package-lock.json or yarn.lock! Delete them to enforce strict pnpm usage."
            exit 1
          fi
          echo "✅ Lockfile validation passed."

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build Check across Workspace
        run: pnpm run build --if-present

      - name: Deploy to Vercel
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push' }}
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "[*] Pulling Vercel production environment..."
            pnpm dlx vercel pull --yes --environment=production

            echo "[*] Building project via Vercel CLI..."
            pnpm dlx vercel build --prod

            echo "[*] Deploying prebuilt artifacts to Vercel production..."
            pnpm dlx vercel deploy --prebuilt --prod
          else
            echo "[!] VERCEL_TOKEN secret is not set. Skipping automated Vercel deployment."
          fi