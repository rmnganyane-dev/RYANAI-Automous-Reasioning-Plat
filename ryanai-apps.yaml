# ==============================================================================
# API Backend Deployment & Service
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ryanai-api
  namespace: ryanai-system
  labels:
    app.kubernetes.io/name: ryanai-api
    app.kubernetes.io/part-of: ryanai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ryanai-api
  template:
    metadata:
      labels:
        app: ryanai-api
    spec:
      containers:
        - name: api
          image: my-app-api:latest
          imagePullPolicy: Never
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              value: "postgresql://ryanai:ryanai_secure_password@postgres:5432/ryanai_db"
            - name: REDIS_URL
              value: "redis://:ryanai_redis_password@redis:6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ryanai-secrets
                  key: JWT_SECRET
            - name: PORT
              value: "3001"
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ryanai-api-svc
  namespace: ryanai-system
  labels:
    app.kubernetes.io/name: ryanai-api-svc
    app.kubernetes.io/part-of: ryanai-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: 3001
  selector:
    app: ryanai-api
---
# ==============================================================================
# Web Frontend Deployment & Service
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ryanai-web
  namespace: ryanai-system
  labels:
    app.kubernetes.io/name: ryanai-web
    app.kubernetes.io/part-of: ryanai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ryanai-web
  template:
    metadata:
      labels:
        app: ryanai-web
    spec:
      containers:
        - name: web
          image: my-app-web:latest
          imagePullPolicy: Never
          env:
            - name: VITE_API_URL
              value: "http://ryanai-api-svc:3001"
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ryanai-web-svc
  namespace: ryanai-system
  labels:
    app.kubernetes.io/name: ryanai-web-svc
    app.kubernetes.io/part-of: ryanai-platform
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30090
  selector:
    app: ryanai-web