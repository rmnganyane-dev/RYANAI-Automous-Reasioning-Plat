Set-Content -Path render.yaml -Value @"
services:
  - type: web
    name: ryanai-reasoning-platform
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_ENV
        value: production
"@